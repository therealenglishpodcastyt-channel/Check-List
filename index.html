<style>

    --text:#f0f0f0; --muted:#888;

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

  header{
    background:var(--surface);border-bottom:3px solid var(--accent);

    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;

  .header-left h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:var(--accent);line-height:1;}
  .header-left p{font-size:0.68rem;color:var(--muted);margin-top:3px;letter-spacing:1.5px;text-transform:uppercase;}

  .stats{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .n{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;}
  .stat .l{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .n.green{color:var(--done-b);}
  .n.yellow{color:var(--yellow);}
  .n.gray{color:var(--muted);}

  .bar-wrap{width:180px;}
  .bar-top{display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);margin-bottom:4px;}
  .bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--done-b));border-radius:99px;transition:width .4s;}

  .export-btn{
    background:var(--accent);color:#fff;border:none;padding:10px 20px;
    border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap;
  }
  .export-btn:hover{background:var(--accent2);transform:translateY(-1px);}

  .main{max-width:980px;margin:0 auto;padding:28px 22px;}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:32px;}
  .summary-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;display:flex;flex-direction:column;gap:8px;
  }
  .summary-card .cat-header{display:flex;align-items:center;gap:8px;font-weight:600;font-size:0.88rem;}
  .summary-card .cat-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:4px;}
  .summary-card .cat-fill{height:100%;border-radius:99px;}
  .summary-card .cat-count{font-size:0.72rem;color:var(--muted);margin-top:2px;}

  .section{margin-bottom:32px;}
  .section-title{

    color:var(--accent);border-bottom:1px solid var(--border);

    background:var(--done);color:var(--done-b);border:1px solid var(--done-b);
    padding:2px 8px;border-radius:99px;letter-spacing:0.5px;margin-left:auto;
  }

  /* Episode card */
  .ep-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;margin-bottom:10px;overflow:hidden;
    transition:border-color .18s;
  }
  .ep-card:hover{border-color:var(--accent);}
  .ep-card.done{border-left:3px solid var(--done-b);}
  .ep-card.pending{border-left:3px solid var(--pending-b);}

  .ep-main{
    display:flex;align-items:center;gap:12px;
    padding:11px 16px;cursor:pointer;
  }
  .ep-num{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:var(--muted);min-width:38px;text-align:center;}
  .ep-status{font-size:1rem;min-width:20px;}
  .ep-title{flex:1;font-size:0.87rem;font-weight:500;line-height:1.35;}
  .ep-file{font-size:0.68rem;color:var(--muted);font-family:monospace;white-space:nowrap;}

  .toggle-done{
    background:none;border:1px solid var(--border);color:var(--muted);
    padding:4px 10px;border-radius:6px;font-size:0.72rem;cursor:pointer;
    transition:all .18s;white-space:nowrap;flex-shrink:0;
  }
  .toggle-done:hover{border-color:var(--done-b);color:var(--done-b);}
  .ep-card.done .toggle-done{border-color:var(--done-b);color:var(--done-b);}

  .thumb-toggle{
    background:none;border:none;color:var(--muted);
    padding:4px 8px;border-radius:6px;font-size:0.72rem;cursor:pointer;
    transition:all .18s;display:flex;align-items:center;gap:4px;flex-shrink:0;
  }
  .thumb-toggle:hover{color:var(--yellow);}
  .thumb-toggle.open{color:var(--yellow);}

  .thumb-panel{
    display:none;border-top:1px solid var(--border);
    background:var(--thumb-bg);padding:14px 18px 16px 68px;
  }
  .thumb-panel.open{display:block;}
  .thumb-label{
    font-size:0.65rem;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }
  .thumb-desc{
    font-size:0.83rem;color:#ccc;line-height:1.65;
    border-left:2px solid var(--accent);padding-left:12px;
  }

  .filter-bar{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:center;
  }
  .filter-btn{
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:6px 14px;border-radius:99px;font-size:0.78rem;cursor:pointer;transition:all .18s;
  }
  .filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filter-label{font-size:0.72rem;color:var(--muted);margin-right:4px;}

  .search-box{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:8px;font-size:0.82rem;width:220px;
    outline:none;transition:border .18s;
  }
  .search-box:focus{border-color:var(--accent);}
  .search-box::placeholder{color:var(--muted);}

  footer{text-align:center;padding:30px;color:var(--muted);font-size:0.72rem;border-top:1px solid var(--border);margin-top:20px;}

  @media(max-width:600px){
    .ep-file{display:none;}
    .stats{gap:14px;}
    header{padding:14px 16px;}
    .main{padding:18px 14px;}
    .thumb-panel{padding-left:18px;}
  }
</style>

  }

  try {

// Load saved state
const saved = JSON.parse(localStorage.getItem('rep_tracker_v3') || '{}');
EPISODES.forEach(e => { if(saved[e.ep] !== undefined) e.done = saved[e.ep]; });

let currentFilter = 'all';
const openThumbs = new Set();

function save() {
  const obj = {};
  EPISODES.forEach(e => obj[e.ep] = e.done);
  localStorage.setItem('rep_tracker_v3', JSON.stringify(obj));
}

function toggleDone(ep, event) {
  event.stopPropagation();
  const e = EPISODES.find(x => x.ep === ep);
  if(e){ e.done = !e.done; save(); renderAll(); }
}

function toggleThumb(ep) {
  if(openThumbs.has(ep)) openThumbs.delete(ep);
  else openThumbs.add(ep);
  renderEpisodes();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEpisodes();
}

function renderSummary() {
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const eps = EPISODES.filter(e => e.cat === cat.id);
    const done = eps.filter(e => e.done).length;
    const pct = Math.round(done/eps.length*100);
    grid.innerHTML += `
      <div class="summary-card">
        <div class="cat-header">
          <span>${cat.emoji}</span>
          <span>${cat.name}</span>
        </div>
        <div class="cat-bar"><div class="cat-fill" style="width:${pct}%;background:${cat.color}"></div></div>
        <div class="cat-count">${done} / ${eps.length} episodios · ${pct}%</div>
      </div>`;
  });
}

function renderStats() {
  const done = EPISODES.filter(e => e.done).length;
  const total = EPISODES.length;
  const pct = Math.round(done/total*100);
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('bar').style.width = pct + '%';
}

function renderEpisodes() {
  const q = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('episodes-container');
  container.innerHTML = '';

  CATEGORIES.forEach(cat => {
    let eps = EPISODES.filter(e => e.cat === cat.id);
    if(currentFilter === 'done') eps = eps.filter(e => e.done);
    if(currentFilter === 'pending') eps = eps.filter(e => !e.done);
    if(q) eps = eps.filter(e => e.title.toLowerCase().includes(q) || String(e.ep).includes(q) || e.thumb.toLowerCase().includes(q));
    if(!eps.length) return;

    const done = EPISODES.filter(e => e.cat === cat.id && e.done).length;
    const total = EPISODES.filter(e => e.cat === cat.id).length;

    let html = `<div class="section">
      <div class="section-title">
        <span>${cat.emoji}</span> ${cat.name}
        <span class="badge">✅ ${done}/${total}</span>
      </div>`;

    eps.forEach(e => {
      const isOpen = openThumbs.has(e.ep);
      html += `
        <div class="ep-card ${e.done?'done':'pending'}">
          <div class="ep-main">
            <div class="ep-num">EP${String(e.ep).padStart(2,'0')}</div>
            <div class="ep-status">${e.done ? '✅' : '⏳'}</div>
            <div class="ep-title">${e.title}</div>
            <div class="ep-file">${e.file}</div>
            <button class="thumb-toggle ${isOpen?'open':''}" onclick="toggleThumb(${e.ep})">
              🎨 ${isOpen ? 'Ocultar' : 'Portada'}
            </button>
            <button class="toggle-done" onclick="toggleDone(${e.ep}, event)">${e.done ? 'Hecho ✓' : 'Marcar'}</button>
          </div>
          <div class="thumb-panel ${isOpen?'open':''}">
            <div class="thumb-label">🎨 Descripción de portada YouTube</div>
            <div class="thumb-desc">${e.thumb}</div>
          </div>
        </div>`;
    });

    html += '</div>';
    container.innerHTML += html;
  });
}

function renderAll() {
  renderStats();
  renderSummary();
  renderEpisodes();
}

function exportMD() {
  const total = EPISODES.length;
  const done = EPISODES.filter(e => e.done).length;
  let md = `# The Real English Podcast — Production Tracker\n\n`;
  md += `**Completados:** ${done} / ${total}\n\n---\n\n`;

  CATEGORIES.forEach(cat => {
    const eps = EPISODES.filter(e => e.cat === cat.id);
    const catDone = eps.filter(e => e.done).length;
    const catObj = CATEGORIES.find(c => c.id === cat.id);
    md += `## ${catObj.emoji} ${catObj.name} (${catDone}/${eps.length})\n\n`;
    eps.forEach(e => {
      md += `### [${e.done ? 'x' : ' '}] EP${String(e.ep).padStart(2,'0')} — ${e.title}\n`;
      md += `- **Archivo:** \`${e.file}\`\n`;
      md += `- **Portada YouTube:** ${e.thumb}\n\n`;
    });
  });

  const blob = new Blob([md], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'REP_Production_Tracker_Portadas.md';
  a.click();
}



// === Supabase hooks para toggleDone y toggleThumb ===
const _origToggleDone = toggleDone;
toggleDone = async function(ep, event) {
  _origToggleDone(ep, event);
  const epObj = EPISODES.find(e => e.ep === ep);
  if (epObj) await _saveDone(ep, epObj.done);
};

const _origToggleThumb = toggleThumb;
toggleThumb = async function(ep) {
  _origToggleThumb(ep);
  const isThumb = openThumbs.has(ep);
  await _saveThumb(ep, isThumb);
};


// Inicialización async con Supabase
async function _init() {
  await loadFromSupabase();
  renderAll();
}
_init();
